services:
  postgres:
    image: postgres:16-alpine
    container_name: cotejai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cotejai
      POSTGRES_PASSWORD: cotejai_secret_2026
      POSTGRES_DB: cotejai
    ports:
      - "5432:5432"
    volumes:
      - cotejai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotejai -d cotejai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cotejai-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://cotejai:cotejai_secret_2026@postgres:5432/cotejai
    ports:
      - "8000:8000"
    volumes:
      # Monta aquí los casos propios del harness: docker compose run --rm app python main.py audit --dir /casos
      - ./casos:/casos

volumes:
  cotejai_pgdata:
